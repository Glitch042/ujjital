<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack Form</title>
</head>
<body>
    <h1>FeedBack Form</h1>
    <hr>
    <form action="">
        <label for="Fname">First Name</label>
        <input type="text" id="Fname" name="Fname">
        <label for="Lname">Last Name</label>
        <input type="text" name="Lname" id="Lname">
        <label for="Email">Email</label>
        <input type="Email" name="Email" id="Email">
        <br>
        <br>
        <br>
        <hr>
        <br>
        <br>
        <label for="phone-number">Phone Number</label>
        <input type="number" name="phone-number" id="phone-number">
        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob">
        <label for="color">Pick Your Favorite Color</label>
        <input type="color" name="color" id="color">
        <br>
        <br>
        <br>
        <hr>
        <br>
        <br>
        <span>Rate Our Service</span>
        <input type="radio" name="radio" id="rating">
        <label for="rating">5</label>
        <input type="radio" name="radio" id="rating">
        <label for="rating">4</label>
        <input type="radio" name="radio" id="rating">
        <label for="rating">3</label>
        <input type="radio" name="radio" id="rating">
        <label for="rating">2</label>
        <input type="radio" name="radio" id="rating">
        <label for="rating">1</label>
        <span>//</span>
        <span>Days of Training</span>
        <input type="checkbox" name="monday" id="monday">
        <label for="monday">Monday</label>
        <input type="checkbox" name="tuesday" id="tuesday">
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" name="wednesday" id="wednesday">
        <label for="wednesday">wednesday</label>
        <input type="checkbox" name="thursday" id="thursday">
        <label for="thursday">Thursday</label>
        <input type="checkbox" name="friday" id="friday">
        <label for="friday">Friday</label>
        <br>
        <br>
        <hr>
        <br>
        <br>
        <label for="gender">Gender</label>
        <select name="gender" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="i rather not say">I Rather Not Say</option>
        </select>
        <span>//</span>
        <label for="marital-status">Marital Status</label>
        <select name="marital-status" id="marital-status">
            <option value="single">Single</option>
            <option value="married">Married</option>
            <option value="divorced">Divorced</option>
            <option value="widowed">Widowed</option>

        </select>
        <br>
        <br>
        <input type="submit" value="Submit The Form">

        
    </form>
</body>
</html>
